<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ocean Image Gallery</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    /* Changed gradient to sky blue -> deep dark blue */
    background: linear-gradient(-45deg, #87CEEB, #00B4DB, #0052D4, #000046);
    background-size: 400% 400%;
    animation: gradientBG 10s ease infinite;
    min-height: 100vh;
    color: white;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

header {
    text-align: center;
    padding: 25px;
}

header h1 {
    font-size: 2.8rem;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
}

/* --- Gallery Grid --- */
.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
    padding: 25px;
}

/* --- Card --- */
.card {
    position: relative;
    overflow: hidden;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

/* --- Images --- */
.card img {
    width: 100%;
    display: block;
    filter: grayscale(30%); /* Slightly reduced grayscale for ocean theme */
    transition: transform 0.7s ease, filter 0.7s ease;
}

/* Move images differently based on overlay direction */
.card:hover img.top {
    transform: translateY(-15px) scale(1.1);
}

.card:hover img.bottom {
    transform: translateY(15px) scale(1.1);
}

.card:hover img.left {
    transform: translateX(-15px) scale(1.1);
}

.card:hover img.right {
    transform: translateX(15px) scale(1.1);
}

/* Remove grayscale on hover */
.card:hover img {
    filter: grayscale(0%);
}

/* --- Overlay --- */
.overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    color: white;
    background: linear-gradient(to top, rgba(0,10,50,0.8), transparent); /* Dark blue overlay tint */
    opacity: 0;
    transition: transform 0.5s cubic-bezier(0.4,0,0.2,1), opacity 0.5s ease;
}

/* --- Initial Directions --- */
.top    { transform: translateY(-100%); }
.bottom { transform: translateY(100%); }
.left   { transform: translateX(-100%); }
.right  { transform: translateX(100%); }

/* --- Hover Overlay --- */
.card:hover .top,
.card:hover .bottom,
.card:hover .left,
.card:hover .right {
    transform: translate(0,0);
    opacity: 1;
}
</style>
</head>
<body>

<header>
    <h1>Ocean Gallery</h1>
</header>

<div class="gallery">
    <div class="card">
        <img src="https://loremflickr.com/400/300/ocean,wave?random=1" class="top" alt="Ocean 1">
        <div class="overlay top">From Top</div>
    </div>
    <div class="card">
        <img src="https://loremflickr.com/400/300/ocean,wave?random=2" class="bottom" alt="Ocean 2">
        <div class="overlay bottom">From Bottom</div>
    </div>
    <div class="card">
        <img src="https://loremflickr.com/400/300/ocean,water?random=3" class="left" alt="Ocean 3">
        <div class="overlay left">From Left</div>
    </div>
    <div class="card">
        <img src="https://loremflickr.com/400/300/ocean,beach?random=4" class="right" alt="Ocean 4">
        <div class="overlay right">From Right</div>
    </div>
    <div class="card">
        <img src="https://loremflickr.com/400/300/sea,wave?random=5" class="top" alt="Ocean 5">
        <div class="overlay top">From Top</div>
    </div>
    <div class="card">
        <img src="https://loremflickr.com/400/300/sea,blue?random=6" class="bottom" alt="Ocean 6">
        <div class="overlay bottom">From Bottom</div>
    </div>
    <div class="card">
        <img src="https://loremflickr.com/400/300/ocean,sunset?random=7" class="left" alt="Ocean 7">
  <div class="overlay left">From Left</div>
    </div>
    <div class="card">
        <img src="https://loremflickr.com/400/300/ocean,surf?random=8" class="right" alt="Ocean 8">
        <div class="overlay right">From Right</div>
    </div>
</div>

</body>
</html>
